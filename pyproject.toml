[project]
name = "trueface_integration"
authors = [
    { name = "SNRG Electricals", email = "admin@snrgelectricals.com" }
]
description = "TrueFace 3000 biometric attendance integration for ERPNext"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
