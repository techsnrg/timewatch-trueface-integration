name: Build Windows Connector

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "connector/**"
      - ".github/workflows/build-windows-connector.yml"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish win-x64 connector
        shell: pwsh
        run: |
          dotnet publish .\connector\TrueFaceConnector\TrueFaceConnector.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -o .\dist\TrueFaceConnector

      - name: Add installer scripts
        shell: pwsh
        run: |
          Copy-Item .\connector\install.bat .\dist\TrueFaceConnector\
          Copy-Item .\connector\uninstall.bat .\dist\TrueFaceConnector\
          Copy-Item .\connector\README.md .\dist\TrueFaceConnector\INSTALL-README.md

      - name: Upload connector artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrueFaceConnector-Windows
          path: .\dist\TrueFaceConnector\**
